# Run `uv run pre-commit install` after `uv sync --extra dev`.
# These local hooks use the project's uv-managed toolchain, so no separate
# hook environments or network access are needed once dependencies are synced.
repos:
  - repo: local
    hooks:
      - id: ruff
        name: ruff lint
        entry: uv run ruff check --fix
        language: system
        types: [python]
      - id: ruff-format
        name: ruff format check
        entry: uv run ruff format --check
        language: system
        types: [python]
      - id: mypy
        name: mypy type check
        entry: uv run mypy .
        language: system
        types: [python]
        pass_filenames: false
      - id: pytest
        name: pytest
        entry: uv run pytest -q
        language: system
        types: [python]
        pass_filenames: false
        stages: [pre-push]
